# Payments real-time feature-store + serving demo.
# Infrastructure and orchestration for notebooks/payments_realtime_featurestore/.
#
# Compute is serverless (the FE-VM workspace is serverless-only); the notebooks %pip
# install their own ML deps (databricks-feature-engineering, lightgbm).
#
# Note: the LightGBM serving endpoint (05) and the Lakebase Online Feature Store (03) are
# created by the Feature Engineering SDK inside their notebooks — they depend on the
# trained/registered model version and on managed Lakebase provisioning, neither of which
# is a declarable bundle resource. Everything else (schema, model, jobs, app) is DABs.

variables:
  payments_catalog:
    description: Unity Catalog catalog for the demo artifacts. Override per workspace/env.
    default: shm_skunkworks_catalog

resources:
  # The schema (shm_skunkworks_catalog.payments) and the registered model
  # (…payments.payments_lgbm) are created with literal names by 00_setup and 04 — they are
  # intentionally NOT declared here, because this bundle runs in `mode: development`, which
  # would prefix declared resource names (dev_<user>_…) and diverge from what the notebooks
  # and serving endpoint reference.
  jobs:
    payments_setup_and_train:
      name: "[${bundle.target}] Payments — Seed, Features, Online, Train, Serve, Benchmark"
      tasks:
        - task_key: seed_data
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/01_seed_data.py
            base_parameters:
              catalog: ${var.payments_catalog}
        - task_key: feature_engineering
          depends_on: [{task_key: seed_data}]
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/02_feature_engineering.py
            base_parameters:
              catalog: ${var.payments_catalog}
        - task_key: online_store
          depends_on: [{task_key: feature_engineering}]
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/03_online_store.py
            base_parameters:
              catalog: ${var.payments_catalog}
        - task_key: train_register
          depends_on: [{task_key: online_store}]
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/04_train_register.py
            base_parameters:
              catalog: ${var.payments_catalog}
        - task_key: serving
          depends_on: [{task_key: train_register}]
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/05_serving.py
            base_parameters:
              catalog: ${var.payments_catalog}
        - task_key: benchmark
          depends_on: [{task_key: serving}]
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/06_benchmark.py
            base_parameters:
              catalog: ${var.payments_catalog}

    payments_backfill_cache:
      name: "[${bundle.target}] Payments — Backfill daily & monthly caches"
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"   # daily at 02:00
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: backfill
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/08_backfill_cache.py
            base_parameters:
              catalog: ${var.payments_catalog}
              grain: both

    # Batch hot path: one full recompute per run, driven by the 5-minute schedule.
    payments_counters_refresh:
      name: "[${bundle.target}] Payments — Counter refresh (hot path, 5-min batch)"
      schedule:
        quartz_cron_expression: "0 */5 * * * ?"   # every 5 minutes
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: counters
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/07_streaming_counters.py
            base_parameters:
              catalog: ${var.payments_catalog}
              mode: batch

    # 30-second hot path: same notebook in loop mode. Deployed unscheduled with max_ticks=1 so
    # a bundle run / CI does a single refresh and stops. For a live 30-s hot path, set
    # max_ticks=0 and run it as an always-running continuous job.
    payments_counters_refresh_rt:
      name: "[${bundle.target}] Payments — Counter refresh (hot path, 30-s loop)"
      tasks:
        - task_key: counters_rt
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/07_streaming_counters.py
            base_parameters:
              catalog: ${var.payments_catalog}
              mode: loop
              max_ticks: "1"
              trigger_seconds: "30"

    # Feature freshness KPI: sub-second batch generator -> Delta -> aggregation -> Lakebase,
    # reporting P10/50/90/99 of event->online freshness. Serverless.
    payments_freshness_kpi:
      name: "[${bundle.target}] Payments — Feature freshness KPI (P10/50/90/99)"
      tasks:
        - task_key: freshness_kpi
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/10_freshness_kpi.py
            base_parameters:
              catalog: ${var.payments_catalog}
              rows_per_second: "200"
              duration_seconds: "120"
              tick_seconds: "1"

    # Kafka consume -> score -> produce reference. Inert unless kafka_bootstrap is set, so it
    # is safe to deploy; provide a broker at run time to activate it.
    payments_kafka_io:
      name: "[${bundle.target}] Payments — Kafka consume, score, produce"
      tasks:
        - task_key: kafka_io
          notebook_task:
            notebook_path: ../notebooks/payments_realtime_featurestore/09_kafka_io.py
            base_parameters:
              catalog: ${var.payments_catalog}
              kafka_bootstrap: ""
              topic_in: transactions
              topic_out: decisions
              auth: uc_service_credential

  apps:
    payments_app:
      name: "payments-feature-store-demo"
      description: "Instrumented latency walk: Kafka -> serving (automatic FE feature lookup) -> Kafka."
      source_code_path: ../notebooks/payments_realtime_featurestore/app
      resources:
        - name: backfill-job
          job:
            id: ${resources.jobs.payments_backfill_cache.id}
            permission: CAN_MANAGE_RUN
        # Serving endpoint — the app queries it; the endpoint does the online feature lookup
        # itself via the Feature Engineering API (the app never touches the online store).
        - name: serving-endpoint
          serving_endpoint:
            name: payments-scoring
            permission: CAN_QUERY
